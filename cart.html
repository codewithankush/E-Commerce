<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .cart-item {
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 20px;
        }

        .total-price {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 30px;
        }

        .btn-remove {
            margin-top: 10px;
        }


        
.navbar {
      margin-bottom: 20px;
      font-family: 'Arial', sans-serif;
    }
  
    .navbar-brand {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      transition: color 0.3s ease;
    }
  
    .navbar-brand:hover {
      color: red;
    }
  
    .navbar-nav .nav-item .nav-link {
      font-size: 16px;
      padding: 10px 15px;
      color: #555;
      font-family: 'Arial', sans-serif;
      transition: color 0.3s ease, background-color 0.3s ease;
    }
  
    .navbar-nav .nav-item .nav-link:hover {
      color: #fff;
      background-color: violet;
      border-radius: 5px;
    }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="index.html">Ankush Store</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="categories.html">Categories</a>
                </li>
                <!-- <li class="nav-item">
                    <a class="nav-link" href="sports.html">Sports</a>
                </li> -->
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <div id="totalPrice" class="total-price"></div>
    <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
    <button class="btn btn-success" onclick="goToCheckout()">Proceed to Checkout</button>
</div>

<script>
    function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartItemsDiv = document.getElementById('cartItems');
        const totalPriceDiv = document.getElementById('totalPrice');

        cartItemsDiv.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.classList.add('cart-item');
            itemDiv.innerHTML = `
                <p>${item.name} - $${item.price}</p>
                <button class="btn btn-danger btn-sm btn-remove" onclick="removeFromCart(${index})">Remove</button>
            `;
            cartItemsDiv.appendChild(itemDiv);
            total += item.price;
        });

        totalPriceDiv.innerHTML = `Total: $${total}`;
    }

    function removeFromCart(index) {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
    }

    function clearCart() {
        localStorage.removeItem('cart');
        loadCart();
    }

    function goToCheckout() {
        // Redirect to a checkout page (you can create this page)
        alert("Proceeding to Checkout");
    }

    window.onload = loadCart;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
